# Render blueprint for the backend. In the Render dashboard: New > Blueprint,
# point at this repo, then set the secret env vars (GEMINI_API_KEY, DATABASE_URL)
# in the service's Environment tab. Everything runs under one service = one base URL.
services:
  - type: web
    name: sales-inbox-router-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CANDIDATE_ID
        value: manviitnd0408@gmail.com
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: DATABASE_URL
        sync: false   # set to your Supabase pooled connection string
      - key: GEMINI_API_KEY
        sync: false   # set to your Gemini key — never committed
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel origin, e.g. https://your-app.vercel.app
